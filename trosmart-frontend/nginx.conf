# Giới hạn riêng cho form liên hệ: tối đa 6 lượt/phút mỗi IP (cho dồn thêm 3 lượt)
limit_req_zone $binary_remote_addr zone=contact_limit:10m rate=6r/m;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Form liên hệ public: chặn sớm ở Nginx, request quá nhiều không tới được backend
    location = /api/v1/public/contacts {
        limit_req zone=contact_limit burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        proxy_pass http://backend:8080/api/v1/public/contacts;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # GHI ĐÈ (không dùng $proxy_add_x_forwarded_for) để khách không giả được IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # GHI ĐÈ (không dùng $proxy_add_x_forwarded_for) để khách không giả được IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        client_max_body_size 50M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}