services:
  backend:
    build:
      context: ./trosmart-backend
      dockerfile: Dockerfile.dev
    container_name: trosmart-backend-dev
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
    volumes:
      - ./trosmart-backend:/app
      - backend_maven_cache:/root/.m2
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./trosmart-frontend
      dockerfile: Dockerfile.dev
    container_name: trosmart-frontend-dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      REACT_APP_API_URL: http://localhost:8080/api/v1
    volumes:
      - ./trosmart-frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: !override
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend_maven_cache:
  frontend_node_modules: